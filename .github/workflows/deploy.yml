name: CD - Build, Test & Deploy to VPS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-test-and-deploy:
    name: Build, Test & Deploy to VPS
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pgminibank
          POSTGRES_USER: minibank
          POSTGRES_PASSWORD: minibank1234
        ports:
          - 2345:5432
        options: >-
          --health-cmd "pg_isready -U minibank -d pgminibank"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Executable JAR
        run: mvn clean package -DskipTests -B

      - name: Transfer Deployment Artifacts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "target/aplikasi-minibank-0.0.1-SNAPSHOT.jar,Dockerfile,docker-compose.prod.yml,infra/"
          target: "/opt/minibank"

      - name: Execute Live Deployment on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'minibank_prod_secret_2026' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DB_PASSWORD
          script: |
            set -e
            echo "==== [1/5] Navigating to /opt/minibank ===="
            cd /opt/minibank

            echo "==== [2/5] Preparing JAR Artifact ===="
            if [ -f target/aplikasi-minibank-0.0.1-SNAPSHOT.jar ]; then
              cp target/aplikasi-minibank-0.0.1-SNAPSHOT.jar ./app.jar
              rm -rf target
            fi

            echo "==== [3/5] Updating Environment Variables ===="
            cat <<EOF > .env
            POSTGRES_DB=pgminibank
            POSTGRES_USER=minibank
            POSTGRES_PASSWORD=${DB_PASSWORD}
            APP_IMAGE=minibank-app:latest
            EOF

            echo "==== [4/5] Building & Launching Container Services ===="
            docker build -t minibank-app:latest .
            docker compose -f docker-compose.prod.yml up -d --force-recreate app

            echo "==== [5/5] Checking Service Health ===="
            for i in {1..12}; do
              if curl -s -f http://127.0.0.1:8080/login > /dev/null; then
                echo "SUCCESS: Minibank application is healthy and running!"
                exit 0
              fi
              echo "Waiting for Spring Boot to be ready... ($i/12)"
              sleep 5
            done

            echo "Deployment finished. Check 'docker logs minibank-prod-app' if health check is still progressing."
