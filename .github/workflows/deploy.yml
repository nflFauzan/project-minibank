name: CD - Build, Push & Deploy to VPS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # =================================================================
  # Job 1: Run Quality Checks & Unit/Integration Tests
  # =================================================================
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pgminibank
          POSTGRES_USER: minibank
          POSTGRES_PASSWORD: minibank1234
        ports:
          - 2345:5432
        options: >-
          --health-cmd "pg_isready -U minibank -d pgminibank"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run Tests with Maven
        run: mvn clean verify -B

  # =================================================================
  # Job 2: Build & Push Docker Image to GitHub Container Registry
  # =================================================================
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/aplikasi-minibank" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =================================================================
  # Job 3: Deploy to VPS via SSH
  # =================================================================
  deploy:
    name: Deploy to VPS (139.190.97.52)
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/aplikasi-minibank" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_ENV"

      - name: Copy docker-compose & config to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.prod.yml,infra/"
          target: "/opt/minibank"

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_IMAGE: ${{ env.IMAGE_NAME }}:latest
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'minibank_prod_secret_2026' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GHCR_IMAGE,DB_PASSWORD
          script: |
            set -e
            echo "==== [1/5] Navigating to /opt/minibank ===="
            cd /opt/minibank

            echo "==== [2/5] Creating / Updating .env file ===="
            cat <<EOF > .env
            POSTGRES_DB=pgminibank
            POSTGRES_USER=minibank
            POSTGRES_PASSWORD=${DB_PASSWORD}
            APP_IMAGE=${GHCR_IMAGE}
            EOF

            echo "==== [3/5] Pulling Latest Container Images ===="
            docker compose -f docker-compose.prod.yml pull app

            echo "==== [4/5] Deploying / Restarting Services ===="
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "==== [5/5] Verifying Deployment Health ===="
            sleep 15
            docker compose -f docker-compose.prod.yml ps
            
            # Health check endpoint
            for i in {1..6}; do
              if curl -s -f http://127.0.0.1:8080/login > /dev/null; then
                echo "SUCCESS: Minibank application is HEALTHY and responding!"
                break
              fi
              echo "Waiting for Spring Boot to be fully ready... ($i/6)"
              sleep 5
            done

            # Clean up old unused images to save disk space
            docker image prune -f

