services:
  postgres:
    image: postgres:17-alpine
    container_name: minibank-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pgminibank}
      POSTGRES_USER: ${POSTGRES_USER:-minibank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minibank_prod_secret_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minibank} -d ${POSTGRES_DB:-pgminibank}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minibank-network

  app:
    image: ${APP_IMAGE:-minibank-app:latest}
    container_name: minibank-prod-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pgminibank}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-minibank}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-minibank_prod_secret_2026}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - minibank-network

volumes:
  postgres_data:
    name: minibank_prod_postgres_data

networks:
  minibank-network:
    name: minibank-prod-network
    driver: bridge
