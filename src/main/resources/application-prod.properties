# ===================================================================
# Production Configuration for Minibank Tazkia
# Profile: prod
# ===================================================================

# Database Configuration (Environment variable overrides with fallbacks)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/pgminibank}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:minibank}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:minibank1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Server & Reverse Proxy Settings
server.port=8080
server.forward-headers-strategy=framework

# Thymeleaf Template Engine
spring.thymeleaf.cache=true
spring.mvc.view.prefix=/templates/
spring.mvc.view.suffix=.html

# Logging
logging.level.root=INFO
logging.level.id.ac.tazkia.minibank=INFO
logging.level.org.springframework.security=WARN

