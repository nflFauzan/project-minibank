<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Permission - Minibank</title>

  <link rel="stylesheet" th:href="@{/css/cs-shell.css}">
  <link rel="stylesheet" th:href="@{/css/custom.css}">
  <link rel="stylesheet" th:href="@{/css/minibank-ui.css}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif !important;
      background-color: #f8fafc;
      color: #0f172a;
      margin: 0;
    }
    .page-title {
      font-size: 24px;
      font-weight: 800;
      color: #113C8D;
      margin: 0;
    }
    .content-card {
      margin-top: 20px;
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 20px rgba(0,0,0,.04);
      padding: 26px 30px;
      max-width: 700px;
    }
    .card-heading {
      font-size: 17px;
      font-weight: 800;
      color: #113C8D;
      margin: 0 0 16px;
      padding-bottom: 10px;
      border-bottom: 1.5px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px 24px;
    }
    .info-item dt {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .info-item dd {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: #1e293b;
    }
    .badge-cat {
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      background: #eff6ff;
      color: #1d4ed8;
      display: inline-block;
    }
    .btn-action-primary {
      background: #113C8D;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px 18px;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      display: inline-block;
    }
    .btn-action-primary:hover {
      background: #0c2d6e;
    }
    .btn-action-outline {
      background: #fff;
      color: #113C8D;
      border: 1.5px solid #113C8D;
      border-radius: 10px;
      padding: 8px 16px;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      display: inline-block;
    }
    .btn-action-outline:hover {
      background: #eff6ff;
    }
    .alert-banner {
      padding: 12px 18px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 600;
    }
    .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
  </style>
</head>

<body>
<div class="cs-shell">
  <div th:replace="~{cs/fragments :: sidebar('rbac-permissions')}"></div>

  <div class="cs-content">
    <div th:replace="~{cs/fragments :: topbar}"></div>

    <main class="cs-page" style="padding: 30px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; max-width: 700px;">
        <div>
          <h1 class="page-title">View Permission</h1>
          <p style="margin: 4px 0 0; color: #64748b; font-size: 14px;">Detail izin wewenang fitur sistem perbankan</p>
        </div>
        <div style="display: flex; gap: 10px;">
          <a th:href="@{'/rbac/permissions/edit/' + ${permission.id}}" class="btn-action-outline">Edit Permission</a>
          <a th:href="@{/rbac/permissions/list}" class="btn-action-primary">&larr; Back to List</a>
        </div>
      </div>

      <div th:if="${successMessage}" class="alert-banner alert-success" th:text="${successMessage}"></div>

      <div class="content-card">
        <div class="card-heading">
          <span>Permission Information</span>
        </div>
        <dl class="info-grid">
          <div class="info-item">
            <dt>Permission Code</dt>
            <dd style="color: #113C8D;" th:text="${permission.permissionCode}">CUSTOMER_VIEW</dd>
          </div>
          <div class="info-item">
            <dt>Permission Name</dt>
            <dd th:text="${permission.permissionName}">View Customer</dd>
          </div>
          <div class="info-item">
            <dt>Category</dt>
            <dd>
              <span class="badge-cat" th:text="${permission.category}">CUSTOMER</span>
            </dd>
          </div>
          <div class="info-item">
            <dt>Created Date</dt>
            <dd th:text="${permission.createdAt != null ? #temporals.format(permission.createdAt, 'dd/MM/yyyy HH:mm') : '-'}">08/11/2025</dd>
          </div>
          <div class="info-item" style="grid-column: span 2;">
            <dt>Description</dt>
            <dd th:text="${permission.description != null ? permission.description : '-'}">View customer information and account status</dd>
          </div>
        </dl>
      </div>
    </main>
  </div>
</div>
</body>
</html>
