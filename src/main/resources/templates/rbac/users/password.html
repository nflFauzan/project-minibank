<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="'Set Password - ' + ${user.username} + ' - Minibank'">Set Password - Minibank</title>

  <link rel="stylesheet" th:href="@{/css/cs-shell.css}">
  <link rel="stylesheet" th:href="@{/css/custom.css}">
  <link rel="stylesheet" th:href="@{/css/minibank-ui.css}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif !important;
      background-color: #f8fafc;
      color: #0f172a;
      margin: 0;
    }
    .page-title {
      font-size: 24px;
      font-weight: 800;
      color: #113C8D;
      margin: 0;
    }
    .content-card {
      margin-top: 20px;
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 20px rgba(0,0,0,.04);
      padding: 30px;
      max-width: 650px;
    }
    .user-summary-box {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      font-size: 14px;
      color: #334155;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 700;
      color: #334155;
      font-size: 14px;
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 14px;
      border: 1.5px solid #d0d7de;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      border-color: #113C8D;
    }
    .field-hint {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }
    .field-error {
      color: #dc2626;
      font-size: 13px;
      font-weight: 600;
      margin-top: 4px;
    }
    .btn-submit {
      background: #113C8D;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 26px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background: #0c2d6e;
    }
    .btn-cancel {
      text-decoration: none;
      color: #64748b;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 20px;
      margin-right: 8px;
    }
    .btn-cancel:hover {
      color: #0f172a;
    }
  </style>
</head>

<body>
<div class="cs-shell">
  <div th:replace="~{cs/fragments :: sidebar('rbac-users')}"></div>

  <div class="cs-content">
    <div th:replace="~{cs/fragments :: topbar}"></div>

    <main class="cs-page" style="padding: 30px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; max-width: 650px;">
        <div>
          <h1 class="page-title" th:text="'Set Password for ' + ${user.username}">Set Password</h1>
          <p style="margin: 4px 0 0; color: #64748b; font-size: 14px;">Atur ulang kata sandi login untuk pengguna ini</p>
        </div>
        <div style="display: flex; gap: 8px;">
          <a th:href="@{'/rbac/users/view/' + ${user.id}}" class="btn-cancel">&larr; Back to User</a>
          <a th:href="@{/rbac/users/list}" class="btn-cancel">Back to List</a>
        </div>
      </div>

      <div class="content-card">
        <div class="user-summary-box">
          <div style="font-weight: 700; color: #113C8D; margin-bottom: 8px;">User Information</div>
          <div><strong>Username:</strong> <span th:text="${user.username}">admin</span></div>
          <div><strong>Full Name:</strong> <span th:text="${user.fullName}">System Administrator</span></div>
          <div><strong>Email:</strong> <span th:text="${user.email}">admin@tazkia.ac.id</span></div>
          <div><strong>Status:</strong>
            <span th:if="${user.enabled}" style="color: #166534; font-weight: 700;">Active</span>
            <span th:unless="${user.enabled}" style="color: #991b1b; font-weight: 700;">Inactive</span>
          </div>
        </div>

        <form th:action="@{'/rbac/users/' + ${user.id} + '/password'}" th:object="${form}" method="post">
          <input type="hidden" th:field="*{userId}" />

          <div class="form-group">
            <label for="newPassword">New Password *</label>
            <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control" placeholder="Enter new password" required />
            <p class="field-hint">Minimum 6 characters required.</p>
            <div class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password *</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="Confirm new password" required />
            <p class="field-hint">Must match the password above.</p>
            <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
          </div>

          <div style="margin-top: 30px; display: flex; align-items: center;">
            <a th:href="@{'/rbac/users/view/' + ${user.id}}" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-submit">Set Password</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
</body>
</html>
