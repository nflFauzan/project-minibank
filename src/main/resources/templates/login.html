<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Minibank</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: url('/images/login-bg.jpg') no-repeat center center/cover;
            min-height: 100vh;
        }

        /* Overlay */
        .overlay {
            width: 100%;
            min-height: 100vh;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        /* Card */
        .glass-card {
            width: 430px;
            max-width: 90vw;
            padding: 45px 40px;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(22px);
            border-radius: 30px;
            text-align: center;
            position: relative;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 35px;
        }

        .back-btn {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            font-size: 26px;
            text-decoration: none;
            color: #1f3c88;
            font-weight: bold;
        }

        .title {
            font-size: 32px;
            font-weight: 800;
            color: #1f3c88;
        }

        /* Input Global */
        .input-field {
            width: 100%;
            height: 52px;
            border-radius: 32px;
            border: 2px solid rgba(0, 0, 0, 0.18);
            padding: 0 20px;
            margin-bottom: 18px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.92);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-field:focus {
            border-color: #4B7BFF;
            box-shadow: 0 0 6px rgba(75, 123, 255, 0.35);
        }

        /* Password Section */
        .password-wrapper {
            width: 100%;
            height: 52px;
            display: flex;
            align-items: center;
            position: relative;
            margin-bottom: 18px;
        }

        .password-wrapper .input-field {
            margin-bottom: 0;
            width: 100%;
            height: 100%;
            padding-right: 50px;
        }

        /* Eye Icon */
        .password-eye {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* Forgot */
        .forgot {
            text-align: left;
            font-size: 12px;
            margin-top: -10px;
            margin-bottom: 22px;
            color: rgba(0, 0, 0, 0.55);
            padding-left: 5px;
        }

        .forgot a {
            color: rgba(0, 0, 0, 0.65);
            text-decoration: none;
        }

        /* Button */
        .btn-login {
            width: 100%;
            height: 52px;
            background: linear-gradient(to bottom, #B8D9FF, #9CC5FF);
            border-radius: 32px;
            border: none;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 5px;
            color: #0d1b45;
            transition: 0.2s;
        }

        .btn-login:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Signup */
        .signup-text {
            font-size: 13px;
            margin-top: 18px;
            color: rgba(0, 0, 0, 0.7);
        }

        .signup-text a {
            color: #0F3FA8;
            font-weight: bold;
            text-decoration: none;
        }

        /* Messages */
        .msg-error {
            color: #b00020;
            background: rgba(254, 226, 226, 0.85);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 14px;
            text-align: left;
        }

        .msg-success {
            color: #065f46;
            background: rgba(209, 250, 229, 0.85);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 14px;
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="overlay">

        <div class="glass-card">

            <div class="header">
                <a href="/" class="back-btn">←</a>
                <div id="page-title" class="title">Welcome Back!</div>
            </div>

            <div th:if="${param.error}" id="error-message" class="msg-error">
                <span>Login gagal. Cek username/password atau akun belum disetujui.</span>
            </div>

            <div th:if="${param.logout}" id="success-message" class="msg-success">
                <span>Kamu sudah logout.</span>
            </div>

            <div th:if="${param.registered}" id="registered-message" class="msg-success">
                <span>Registrasi berhasil. Menunggu approval admin.</span>
            </div>

            <form th:action="@{/login}" method="post">

                <input type="text" id="username" name="username" class="input-field" placeholder="Username" required>

                <div class="password-wrapper">
                    <input type="password" id="password" name="password" class="input-field" placeholder="Password" required>

                    <button type="button" class="password-eye" tabindex="-1">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path fill="currentColor"
                                d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z" />
                        </svg>
                    </button>
                </div>

                <div class="forgot">
                    <a id="forgot-password-link" href="#">Forgot Username or Password?</a>
                </div>

                <button type="submit" id="login-button" class="btn-login">LOGIN</button>

            </form>

            <div class="signup-text">
                Create an Account? <a id="signup-link" th:href="@{/signup}">SIGN UP here</a>
            </div>

        </div>

    </div>

    <script>
        document.querySelectorAll('.password-eye').forEach(btn => {

            const input = btn.previousElementSibling;

            const show = () => input.type = 'text';
            const hide = () => input.type = 'password';

            btn.addEventListener('mousedown', show);
            btn.addEventListener('mouseup', hide);
            btn.addEventListener('mouseleave', hide);

            btn.addEventListener('touchstart', show);
            btn.addEventListener('touchend', hide);

        });
    </script>

</body>

</html>
