<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Minibank</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-bsi-bg-light min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full bg-white rounded-lg shadow-xl p-8 mx-auto">
        <!-- Logo/Header -->
        <div class="text-center mb-8">
            <h1 id="page-title" class="text-3xl font-bold text-bsi-darker">Minibank</h1>
            <p class="text-bsi-gray mt-2">Please sign in to continue</p>
        </div>

        <!-- Error/Success Messages -->
        <div id="error-message" class="msg-error bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" th:if="${param.error}">
            <span>Login gagal. Cek username/password atau akun belum disetujui.</span>
        </div>
        
        <div id="success-message" class="msg-success bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4" th:if="${param.logout}">
            <span>You have been logged out successfully</span>
        </div>

        <div id="registered-message" class="msg-success bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4" th:if="${param.registered}">
            <span>Registrasi berhasil. Menunggu approval admin.</span>
        </div>

        <!-- Login Form -->
        <form method="post" th:action="@{/login}" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                <input type="text" id="username" name="username" required class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-bsi-primary focus:border-bsi-primary transition-colors" placeholder="Enter your username">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input type="password" id="password" name="password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-bsi-primary focus:border-bsi-primary transition-colors" placeholder="Enter your password">
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input type="checkbox" id="remember-me" name="remember-me" class="h-4 w-4 text-bsi-primary focus:ring-bsi-primary border-gray-300 rounded">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-700">
                        Remember me
                    </label>
                </div>
                <a id="forgot-password-link" href="#" class="text-sm text-bsi-primary hover:text-bsi-darker">
                    Forgot password?
                </a>
            </div>

            <button type="submit" id="login-button" class="btn-login w-full bg-bsi-primary hover:bg-bsi-darker text-white font-medium py-3 px-4 rounded-lg transition duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-bsi-primary focus:ring-offset-2 shadow-sm">
                Sign In
            </button>
        </form>

        <!-- Signup Link -->
        <div class="signup-text mt-4 text-center text-sm text-bsi-gray">
            Don't have an account? <a id="signup-link" th:href="@{/signup}" class="text-bsi-primary hover:text-bsi-darker font-medium">Sign up here</a>
        </div>

        <!-- Footer -->
        <div class="mt-8 text-center">
            <p class="text-xs text-bsi-gray">
                &copy; 2024 Minibank. All rights reserved.
            </p>
        </div>
    </div>
</body>
</html>
