<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Ubah Role Pengguna - Admin</title>
    <link th:href="@{/css/custom.css}" rel="stylesheet" />
    <style>
      body { margin:0; font-family: Arial, sans-serif; background: #f3f8ff; padding: 30px; }
      .container { max-width: 700px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 30px 40px; box-shadow: 0 6px 24px rgba(0,0,0,0.06); }
      .back { font-size:15px; text-decoration:none; color:#113C8D; font-weight:700; display:inline-block; margin-bottom:16px; }
      h2 { color: #113C8D; margin-top: 0; }
      p.sub { color: #556; margin-bottom: 24px; font-size: 14px; }
      .user-info { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 8px; padding: 14px 18px; margin-bottom: 20px; font-size: 14px; }
      .roles-container { background: #fff; border: 1.5px solid #d0d7de; border-radius: 8px; padding: 16px 20px; margin-bottom: 24px; }
      .roles-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
      .role-label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
      .btn-save {
        background: #113C8D; color: #fff; border: none; border-radius: 8px; padding: 12px 24px; font-weight: 700; font-size: 15px; cursor: pointer;
      }
      .btn-save:hover { background: #0c2d6e; }
    </style>
</head>
<body>
  <div class="container">
    <a th:href="@{/dashboard}" href="/dashboard" class="back">&#8592; Kembali ke Dashboard</a>
    <h2>Ubah Hak Akses (Role) Pengguna</h2>
    <p class="sub">Admin dapat menambah atau mengurangi hak akses operasional untuk akun pengguna ini.</p>

    <div class="user-info">
      <div><strong>Nama Lengkap:</strong> <span th:text="${user.fullName}"></span></div>
      <div><strong>Username:</strong> <span th:text="${user.username}"></span></div>
      <div><strong>Email:</strong> <span th:text="${user.email}"></span></div>
      <div><strong>Status Akun:</strong> <span th:text="${user.enabled ? 'Aktif' : 'Non-aktif'}"></span></div>
    </div>

    <form th:action="@{/admin/users/{id}/roles(id=${user.id})}" method="post">
      <div class="roles-container">
        <label style="font-weight: 700; color: #113C8D;">Pilih Hak Akses:</label>
        <div class="roles-grid">
          <label class="role-label">
            <input type="checkbox" name="roles" value="ROLE_CS"
                   th:checked="${#sets.contains(user.roles.![name], 'ROLE_CS')}" />
            <span><strong>Customer Service (CS)</strong> - Mengelola nasabah & pembukaan rekening</span>
          </label>
          <label class="role-label">
            <input type="checkbox" name="roles" value="ROLE_TELLER"
                   th:checked="${#sets.contains(user.roles.![name], 'ROLE_TELLER')}" />
            <span><strong>Teller</strong> - Setoran tunai, penarikan tunai, transfer antar rekening</span>
          </label>
          <label class="role-label">
            <input type="checkbox" name="roles" value="ROLE_BRANCH_MANAGER"
                   th:checked="${#sets.contains(user.roles.![name], 'ROLE_BRANCH_MANAGER') or #sets.contains(user.roles.![name], 'ROLE_SUPERVISOR')}" />
            <span><strong>Branch Manager (SPV)</strong> - Otorisasi persetujuan nasabah & limit transaksi</span>
          </label>
          <label class="role-label">
            <input type="checkbox" name="roles" value="ROLE_ADMIN"
                   th:checked="${#sets.contains(user.roles.![name], 'ROLE_ADMIN')}" />
            <span><strong>Administrator</strong> - Manajemen registrasi akun & konfigurasi hak akses</span>
          </label>
        </div>
      </div>

      <div>
        <button type="submit" class="btn-save">Simpan Perubahan Role</button>
      </div>
    </form>
  </div>
</body>
</html>
