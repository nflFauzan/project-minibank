<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Admin Approval</title>
    <link th:href="@{/css/custom.css}" rel="stylesheet" />
    <style>
      body { margin:0; font-family: Arial, sans-serif; background: url('/images/login-bg.jpg') center/cover no-repeat; background-size:cover; }
      .overlay { min-height: 100vh; background: rgba(255,255,255,0.35); backdrop-filter: blur(8px); display:flex; align-items:center; justify-content:center; padding:40px; }
      .card { width: 900px; background: rgba(255,255,255,0.85); border-radius:14px; padding:26px 34px; box-shadow:0 10px 30px rgba(0,0,0,0.08); }
      .back { font-size:16px; text-decoration:none; color:#113C8D; font-weight:700; display:inline-block; margin-bottom:12px; }
      h1 { text-align:center; margin:6px 0 8px; color:#113C8D; font-size:32px; }
      p.info { text-align:center; color:#445; margin-bottom:22px; }
      .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px 28px; }
      .field { height:50px; display:flex; align-items:center; padding:0 18px; border-radius:28px; background:#fff; border:1.6px solid rgba(0,0,0,0.12); }
      .field input { border:none; width:100%; font-size:15px; background:transparent; outline:none; }
      .role-selection { margin: 24px 0 16px; background: #fff; padding: 18px 24px; border-radius: 12px; border: 1.6px solid rgba(0,0,0,0.12); }
      .role-title { font-weight: 700; color: #113C8D; margin-bottom: 12px; }
      .roles-grid { display: flex; gap: 20px; flex-wrap: wrap; }
      .role-item { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
      .actions { display:flex; gap:18px; justify-content:center; margin-top:20px; }
      .btn { width:200px; padding:12px 18px; border-radius:28px; font-weight:800; font-size:16px; cursor:pointer; border:none; }
      .btn-approve { background: linear-gradient(to bottom,#B8D9FF,#9CC5FF); color:#07204a; box-shadow: 0 6px 18px rgba(0,80,180,0.12); }
      .btn-reject { background: linear-gradient(to bottom,#ffe6e6,#ffd6d6); color:#802020; box-shadow: 0 6px 18px rgba(180,0,0,0.06); }
      .small-note { text-align:center; color:#666; margin-top:14px; font-size:13px; }
    </style>
</head>
<body>
  <div class="overlay">
    <div class="card">
      <a th:href="@{/dashboard}" href="/dashboard" class="back">&#8592; Kembali ke Dashboard</a>
      <h1>Verifikasi & Penetapan Role Pengguna</h1>
      <p class="info">Tinjau data pendaftaran pendaftar dan tentukan hak akses (Role) sebelum menyetujui.</p>

      <div class="grid">
        <div class="field">
          <input type="text" th:value="${user.fullName}" readonly title="Nama Lengkap" placeholder="Nama Lengkap" />
        </div>
        <div class="field">
          <input type="text" th:value="${user.dosenPembimbing != null ? user.dosenPembimbing : '-'}" readonly title="Dosen Pembimbing" placeholder="Dosen Pembimbing" />
        </div>

        <div class="field">
          <input type="text" th:value="${user.email}" readonly title="Email" placeholder="Email" />
        </div>
        <div class="field">
          <input type="text" th:value="${user.username}" readonly title="Username" placeholder="Username" />
        </div>

        <div class="field">
          <input type="text" th:value="${user.prodi}" readonly title="Program Studi" placeholder="Program Studi" />
        </div>
        <div class="field">
          <input type="text" th:value="${maskedPassword}" readonly title="Password" placeholder="Password" />
        </div>

        <div class="field">
          <input type="text" th:value="${user.nim}" readonly title="NIM" placeholder="NIM" />
        </div>
        <div class="field">
          <input type="text" th:value="${maskedConfirm}" readonly title="Konfirmasi Password" placeholder="Konfirmasi Password" />
        </div>
      </div>

      <form th:action="@{/admin/approve/{id}(id=${user.id})}" method="post" id="approveForm">
        <div class="role-selection">
          <div class="role-title">Pilih Hak Akses (Role) Pengguna:</div>
          <div class="roles-grid">
            <label class="role-item">
              <input type="checkbox" name="roles" value="ROLE_CS" checked />
              <span>Customer Service (CS)</span>
            </label>
            <label class="role-item">
              <input type="checkbox" name="roles" value="ROLE_TELLER" />
              <span>Teller</span>
            </label>
            <label class="role-item">
              <input type="checkbox" name="roles" value="ROLE_BRANCH_MANAGER" />
              <span>Branch Manager (SPV)</span>
            </label>
            <label class="role-item">
              <input type="checkbox" name="roles" value="ROLE_ADMIN" />
              <span>Administrator</span>
            </label>
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-approve">APPROVE</button>
          <button type="button" class="btn btn-reject" onclick="if(confirm('Tolak dan hapus pendaftaran akun ini?')) document.getElementById('rejectForm').submit();">REJECT</button>
        </div>
      </form>

      <form th:action="@{/admin/reject/{id}(id=${user.id})}" method="post" id="rejectForm" style="display:none;"></form>

      <div class="small-note">Catatan: Password dienkripsi dengan BCrypt di database untuk keamanan akun mahasiswa/pengguna.</div>
    </div>
  </div>
</body>
</html>
