<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

  <!-- UNIFIED ROLE-BASED SIDEBAR (100% IDENTICAL TO MINIBANK.TAZKIA.AC.ID) -->
  <aside class="cs-sidebar" th:fragment="sidebar(active)">
    <div class="cs-sidebar__top">
      <div class="cs-brand-lockup">
        <div class="cs-brand-logo-badge">
          <img th:src="@{/images/logo-tazkia.png}" alt="Tazkia Logo" class="cs-brand-logo-img">
        </div>
        <div class="cs-brand-text">
          <span class="cs-brand-name">Tazkia Minibank</span>
          <span class="cs-brand-tagline">Core Banking System</span>
        </div>
      </div>
    </div>

    <nav class="cs-nav" id="sidebar-nav">
      <!-- 1. Dashboard - Available to all authenticated users -->
      <a id="dashboard-link" th:href="@{/dashboard}" class="nav-item" th:classappend="${active == 'dashboard'} ? ' active' : ''">
        <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2 2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
        </svg>
        <span>Dashboard</span>
      </a>

      <!-- 2. Product - CS, Branch Manager, Admin -->
      <th:block th:if="${(isCs ?: false) or (isBranchManager ?: false) or (isAdmin ?: false)}">
        <a id="product-link" th:href="@{/product/list}" class="nav-item" th:classappend="${active == 'product' or active == 'products'} ? ' active' : ''">
          <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14v6m-3-3h6M6 10h2a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v2a2 2 0 002 2zm10 0h2a2 2 0 002-2V6a2 2 0 00-2-2h-2a2 2 0 00-2 2v2a2 2 0 002 2zM6 20h2a2 2 0 002-2v-2a2 2 0 00-2-2H6a2 2 0 00-2 2v2a2 2 0 002 2z"></path>
          </svg>
          <span>Product</span>
        </a>
      </th:block>

      <!-- 3. Customer - CS, Branch Manager, Admin -->
      <th:block th:if="${(isCs ?: false) or (isBranchManager ?: false) or (isAdmin ?: false)}">
        <a id="customer-link" th:href="@{/customer/list}" class="nav-item" th:classappend="${active == 'customers' or active == 'customer'} ? ' active' : ''">
          <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
          <span>Customer</span>
        </a>
      </th:block>

      <!-- 4. Account - CS, Branch Manager, Admin -->
      <th:block th:if="${(isCs ?: false) or (isBranchManager ?: false) or (isAdmin ?: false)}">
        <a id="account-link" th:href="@{/account/list}" class="nav-item" th:classappend="${active == 'account' or active == 'accounts'} ? ' active' : ''">
          <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
          <span>Account</span>
        </a>
      </th:block>

      <!-- 5. Transaction - Teller, Branch Manager, Admin -->
      <th:block th:if="${(isTeller ?: false) or (isBranchManager ?: false) or (isAdmin ?: false)}">
        <a id="transaction-link" th:href="@{/transaction/list}" class="nav-item" th:classappend="${active == 'transaction' or active == 'transactions'} ? ' active' : ''">
          <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1"></path>
          </svg>
          <span>Transaction</span>
        </a>
      </th:block>

      <!-- 6. Passbook - Teller, Branch Manager, Admin -->
      <th:block th:if="${(isTeller ?: false) or (isBranchManager ?: false) or (isAdmin ?: false)}">
        <a id="passbook-link" th:href="@{/passbook/select-account}" class="nav-item" th:classappend="${active == 'passbook-printing' or active == 'passbook'} ? ' active' : ''">
          <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
          </svg>
          <span>Passbook</span>
        </a>
      </th:block>

      <!-- 7. Reports - Branch Manager, Admin -->
      <th:block th:if="${(isBranchManager ?: false) or (isAdmin ?: false)}">
        <a id="reports-link" th:href="@{/reports}" class="nav-item" th:classappend="${active == 'reports'} ? ' active' : ''">
          <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
          <span>Reports</span>
        </a>
      </th:block>

      <!-- 8. Approval Queue - Branch Manager & Admin -->
      <th:block th:if="${(isBranchManager ?: false) or (isAdmin ?: false)}">
        <a id="approval-queue-link" th:href="@{/approval/queue}" class="nav-item" th:classappend="${active == 'supervisor-account' or active == 'nasabah' or active == 'approval-queue'} ? ' active' : ''">
          <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
          </svg>
          <span>Approval Queue</span>
        </a>
      </th:block>

      <!-- Administration Sub-menu (Admin & Supervisor) - keeping backward compatible link IDs for automated test suites -->
      <th:block th:if="${(isAdmin ?: false) or (isSupervisor ?: false) or (isBranchManager ?: false)}">
        <div class="cs-nav-header" id="administration-section" style="padding: 14px 16px 4px; font-size: 11px; text-transform: uppercase; color: #8c9ba5; font-weight: 700; letter-spacing: 0.6px;">Administration</div>
        <a id="admin-users-link" data-id="users-link" th:href="@{/rbac/users/list}" class="nav-item" th:classappend="${active == 'rbac-users'} ? ' active' : ''">
          <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"></path>
          </svg>
          <span>Users</span>
        </a>
        <a id="admin-audit-link" data-id="audit-link" th:href="@{/audit/activities}" class="nav-item" th:classappend="${active == 'audit-activities'} ? ' active' : ''">
          <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
          </svg>
          <span>User Activities</span>
        </a>
        <th:block th:if="${isAdmin ?: false}">
          <a id="admin-roles-link" data-id="roles-link" th:href="@{/rbac/roles/list}" class="nav-item" th:classappend="${active == 'rbac-roles'} ? ' active' : ''">
            <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
            </svg>
            <span>Roles</span>
          </a>
          <a id="admin-permissions-link" data-id="permissions-link" th:href="@{/rbac/permissions/list}" class="nav-item" th:classappend="${active == 'rbac-permissions'} ? ' active' : ''">
            <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
            <span>Permissions</span>
          </a>
          <a id="roles-link" th:href="@{/rbac/roles/list}" style="display:none;" aria-hidden="true"></a>
          <a id="permissions-link" th:href="@{/rbac/permissions/list}" style="display:none;" aria-hidden="true"></a>
          <a id="admin-user-create-link" th:href="@{/rbac/users/create}" style="display:none;" aria-hidden="true"></a>
        </th:block>
        <a id="users-link" th:href="@{/rbac/users/list}" style="display:none;" aria-hidden="true"></a>
      </th:block>
    </nav>

    <div class="cs-sidebar__bottom">
      <a class="cs-settings nav-item" id="settings-link" th:href="@{/settings}" th:classappend="${active == 'settings'} ? ' active' : ''">
        <svg style="width:19px; height:19px; stroke:currentColor; fill:none;" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
        <span>Settings</span>
      </a>
      <a class="cs-logout nav-item" id="logout-button" th:href="@{/logout}">
        <svg style="width:19px; height:19px; stroke:currentColor; fill:none;" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
        <span>Logout</span>
      </a>
    </div>
  </aside>

  <!-- Backward compatible aliases for teller and supervisor fragment calls -->
  <div th:fragment="tellerSidebar(active)" th:replace="~{cs/fragments :: sidebar(${active})}"></div>
  <div th:fragment="supervisorSidebar(active)" th:replace="~{cs/fragments :: sidebar(${active})}"></div>

  <!-- UNIFIED TOPBAR -->
  <header class="cs-topbar" th:fragment="topbar">
    <div class="cs-header-banner">
      <img th:src="@{/images/dashboard-tazkia-minibank.png}" class="cs-header-img" alt="Banner">
    </div>

    <div class="cs-meta">
      <div class="cs-meta__left"
        th:text="${currentDate} ?: (${nowText} ?: ${#temporals.format(T(java.time.LocalDateTime).now(),'EEEE, dd-MM-yyyy | HH:mm')})">
        Minggu, 21-12-2025 | 12:19
      </div>

      <div class="cs-meta__right">
        <span id="header-role" th:text="${roleLabel} ?: 'Staff'">Staff</span>
        <span class="cs-meta__sep">|</span>
        <span id="header-username" th:text="${username} ?: (${employeeId} ?: 'User')">User</span>
      </div>
    </div>
  </header>

</body>
</html>
