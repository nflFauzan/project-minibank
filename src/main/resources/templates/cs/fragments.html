<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

  <!-- UNIFIED ROLE-BASED SIDEBAR -->
  <aside class="cs-sidebar" th:fragment="sidebar(active)">
    <div class="cs-sidebar__top">
      <div class="cs-mini-icon">
        <div class="cs-brand-text">
          <img th:src="@{/images/logo-tazkia.png}" style="height:24px; vertical-align:middle; margin-right:8px;" alt="logo">
          Tazkia Minibank
        </div>
      </div>
    </div>

    <nav class="cs-nav">
      <!-- Universal Dashboard Link -->
      <a id="dashboard-link" th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? ' active' : ''">Dashboard</a>

      <!-- CS Links -->
      <th:block th:if="${(isCs ?: false) or (isAdmin ?: false)}">
        <a id="customer-link" th:href="@{/cs/customers}" th:classappend="${active == 'customers'} ? ' active' : ''">Customers</a>
        <a id="account-link" th:href="@{/cs/account}" th:classappend="${active == 'account'} ? ' active' : ''">Account</a>
        <a id="product-link" th:href="@{/cs/product}" th:classappend="${active == 'product'} ? ' active' : ''">Pengelolaan Produk Bank</a>
      </th:block>

      <!-- Teller Links -->
      <th:block th:if="${(isTeller ?: false) or (isAdmin ?: false)}">
        <a id="transaction-link" th:href="@{/teller/transaction/list}" th:classappend="${active == 'transaction'} ? ' active' : ''">Transaksi</a>
        <a id="passbook-link" th:href="@{/teller/passbook/select-account}" th:classappend="${active == 'passbook-printing'} ? ' active' : ''">Passbook</a>
      </th:block>

      <!-- Supervisor / Branch Manager Links -->
      <th:block th:if="${(isBranchManager ?: false) or (isAdmin ?: false)}">
        <a id="approval-queue-link" th:href="@{/supervisor/nasabah}" th:classappend="${active == 'nasabah'} ? ' active' : ''">Approval Nasabah</a>
      </th:block>

      <!-- Administration (Admin only) -->
      <th:block th:if="${isAdmin ?: false}">
        <div class="cs-nav-header" style="padding: 12px 18px 4px; font-size: 11px; text-transform: uppercase; color: #8c9ba5; font-weight: 700; letter-spacing: 0.5px;">Administration</div>
        <a id="admin-users-link" th:href="@{/rbac/users/list}" th:classappend="${active == 'rbac-users'} ? ' active' : ''">Users</a>
        <a id="admin-roles-link" th:href="@{/rbac/roles/list}" th:classappend="${active == 'rbac-roles'} ? ' active' : ''">Roles</a>
        <a id="admin-permissions-link" th:href="@{/rbac/permissions/list}" th:classappend="${active == 'rbac-permissions'} ? ' active' : ''">Permissions</a>
        <!-- Backward-compatible hidden link for legacy tests -->
        <a id="admin-user-create-link" th:href="@{/admin/users/create}" style="display:none;">Tambah Pengguna</a>
      </th:block>
    </nav>

    <div class="cs-sidebar__bottom">
      <a class="cs-settings" id="settings-link" th:href="@{/settings}">Settings</a>
      <a class="cs-logout" id="logout-button" th:href="@{/logout}">Logout</a>
    </div>
  </aside>

  <!-- Backward compatible aliases for teller and supervisor fragment calls -->
  <div th:fragment="tellerSidebar(active)" th:replace="~{cs/fragments :: sidebar(${active})}"></div>
  <div th:fragment="supervisorSidebar(active)" th:replace="~{cs/fragments :: sidebar(${active})}"></div>

  <!-- UNIFIED TOPBAR -->
  <header class="cs-topbar" th:fragment="topbar">
    <div class="cs-header-banner">
      <img th:src="@{/images/dashboard-tazkia-minibank.png}" class="cs-header-img" alt="Banner">
    </div>

    <div class="cs-meta">
      <div class="cs-meta__left"
        th:text="${currentDate} ?: (${nowText} ?: ${#temporals.format(T(java.time.LocalDateTime).now(),'EEEE, dd-MM-yyyy | HH:mm')})">
        Minggu, 21-12-2025 | 12:19
      </div>

      <div class="cs-meta__right">
        <span id="header-role" th:text="${roleLabel} ?: 'Staff'">Staff</span>
        <span class="cs-meta__sep">|</span>
        <span id="header-username" th:text="${username} ?: (${employeeId} ?: 'User')">User</span>
      </div>
    </div>
  </header>

</body>
</html>
