<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CS - Customers</title>
  
  <link rel="stylesheet" th:href="@{/css/cs-shell.css}">
  <link rel="stylesheet" th:href="@{/css/custom.css}">
  <link rel="stylesheet" th:href="@{/css/minibank-ui.css}">
  <link rel="stylesheet" th:href="@{/css/account.css}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif !important;
      background-color: #f8fafc;
      color: #0f172a;
    }

    .page-title {
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
    }

    .btn-add-customer {
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      background: #fff;
      font-weight: 700;
      color: #1e3a8a;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
    }

    .btn-add-customer:hover {
      background: #f1f5f9;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.05);
    }

    /* Table Styling */
    .table-container {
      margin-top: 24px;
      background: #fff;
      border: 1px solid #f1f5f9;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
      padding: 12px;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
      font-size: 14px;
    }

    thead tr {
      text-align: left;
      color: #64748b;
      font-weight: 700;
      border-bottom: 2px solid #f8fafc;
    }

    th {
      padding: 16px 12px;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    td {
      padding: 16px 12px;
      vertical-align: middle;
      color: #475569;
    }

    tr:last-child {
      border-bottom: none;
    }

    tbody tr {
      border-bottom: 1px solid #f8fafc;
      transition: background 0.2s;
    }

    tbody tr:hover {
      background-color: #fcfdfe;
    }

    /* Badge Status */
    .status-badge {
      background: #ecfdf5;
      color: #059669;
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      display: inline-block;
    }

    .action-link {
      text-decoration: none;
      font-weight: 700;
      color: #2563eb;
      transition: color 0.2s;
    }

    .action-link:hover {
      color: #1e3a8a;
      text-decoration: underline;
    }

    .divider {
      color: #e2e8f0;
      margin: 0 8px;
    }
  </style>
</head>

<body>
<div class="cs-shell">
  <div th:replace="~{cs/fragments :: sidebar('customers')}"></div>

  <div class="cs-content">
    <div th:replace="~{cs/fragments :: topbar}"></div>

    <main class="cs-page" style="padding: 32px;">

      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div class="page-title">Customers</div>

        <a th:href="@{/cs/customers/new}" class="btn-add-customer">
          + Pendaftaran Nasabah
        </a>
      </div>

      <div th:if="${success}" style="margin-top: 18px; padding: 14px 18px; background: rgba(236,253,245,0.85); backdrop-filter: blur(10px); color: #047857; border: 1px solid rgba(167,243,208,0.8); border-radius: 12px; font-weight: 600;" th:text="${success}"></div>
      <div th:if="${error}" style="margin-top: 18px; padding: 14px 18px; background: rgba(254,242,242,0.85); backdrop-filter: blur(10px); color: #991b1b; border: 1px solid rgba(254,202,202,0.8); border-radius: 12px; font-weight: 600;" th:text="${error}"></div>

      <!-- Filter Toolbar -->
      <div style="margin-top: 18px; background: #fff; border: 1px solid #f1f5f9; border-radius: 16px; padding: 18px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.02);">
        <form method="get" th:action="@{/cs/customers}" style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
          
          <!-- Periode Dropdown -->
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase;">Periode Praktikum</label>
            <select name="period" style="padding: 9px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 13px; font-weight: 600; color: #1e293b; background: #fff; outline: none; min-width: 200px;">
              <option value="all" th:selected="${selectedPeriod == 'all'}">-- Semua Periode --</option>
              <option th:each="p : ${periods}" 
                      th:value="${p.id}" 
                      th:selected="${selectedPeriod != null and selectedPeriod == p.id.toString()}"
                      th:text="${(p.nama != null ? p.nama : p.kode) + (p.status.name() == 'ACTIVE' ? ' (Aktif)' : ' [Arsip]') + ' - ' + p.kode}">
                2026/2027 (Aktif)
              </option>
            </select>
          </div>

          <!-- Tanggal Mulai -->
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase;">Mulai Tanggal</label>
            <input type="date" name="startDate" th:value="${startDate}" 
                   style="padding: 8px 12px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 13px; color: #1e293b; outline: none;" />
          </div>

          <!-- Tanggal Selesai -->
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase;">Sampai Tanggal</label>
            <input type="date" name="endDate" th:value="${endDate}" 
                   style="padding: 8px 12px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 13px; color: #1e293b; outline: none;" />
          </div>

          <!-- Search Keyword -->
          <div style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 200px;">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase;">Pencarian</label>
            <input type="text" name="q" th:value="${q}" placeholder="Nama, CIF, NIK, No HP..." 
                   class="no-uppercase"
                   style="padding: 9px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 13px; outline: none;" />
          </div>

          <!-- Buttons -->
          <div style="display: flex; gap: 8px; align-self: flex-end;">
            <button type="submit" 
                    style="background: #1e3a8a; color: #fff; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
              Filter
            </button>
            <a th:href="@{/cs/customers}" 
               style="background: #f1f5f9; color: #475569; padding: 10px 16px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 13px;">
              Reset
            </a>
          </div>
        </form>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>CIF</th>
              <th>NIK</th>
              <th>Nama Lengkap</th>
              <th>Periode</th>
              <th>Status</th>
              <th>Created At</th>
              <th style="width:160px;">Action</th>
            </tr>
          </thead>

          <tbody>
            <tr th:if="${customers == null || #lists.isEmpty(customers)}">
              <td colspan="7" style="padding:40px; text-align:center; color:#94a3b8;">
                <div style="font-size: 16px;">Belum ada data nasabah pada filter periode ini.</div>
              </td>
            </tr>

            <tr th:each="n : ${customers}">
              <td style="font-weight:700; color:#1e3a8a;" th:text="${n.cif}">C0000001</td>
              <td th:text="${n.nik}">123456789</td>
              <td style="font-weight:700; color:#0f172a;" 
                  th:text="${n.namaLengkap != null ? n.namaLengkap : n.namaSesuaiIdentitas}">
                Nama Nasabah
              </td>
              <td>
                <span th:if="${n.periode != null and n.periode.status.name() == 'ACTIVE'}" 
                      style="padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0;" 
                      th:text="${n.periode.kode}">2026/2027</span>
                <span th:if="${n.periode != null and n.periode.status.name() == 'ARCHIVED'}" 
                      style="padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; background: #fef3c7; color: #92400e; border: 1px solid #fde68a;">
                  Arsip <span th:text="${n.periode.kode}">2025/2026</span>
                </span>
                <span th:if="${n.periode == null}" style="font-size: 12px; color: #94a3b8;">-</span>
              </td>
              <td>
                <span class="status-badge" th:text="${n.status}">ACTIVE</span>
              </td>
              <td style="font-size: 13px; color: #64748b;" th:text="${n.createdAt}">2026-01-10</td>
              <td>
                <a th:href="@{|/cs/customers/${n.id}|}" class="action-link">View</a>
                <span class="divider">|</span>
                <a th:href="@{|/cs/customers/${n.id}/edit|}" class="action-link">Edit</a>
                <span class="divider">|</span>
                <form th:action="@{|/cs/customers/${n.id}/delete|}" method="post" style="display:inline;"
                      onsubmit="return confirm('Apakah Anda yakin ingin menghapus nasabah ini?');">
                  <button type="submit" class="action-link" style="background:none; border:none; padding:0; cursor:pointer; color:#dc2626; font-family:inherit; font-size:inherit;">
                    Delete
                  </button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div th:if="${page != null and page.totalPages > 1}" 
           style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding: 12px 16px; background: #fff; border-radius: 12px; border: 1px solid #f1f5f9;">
        <span style="font-size: 13px; color: #64748b;">
          Menampilkan <strong th:text="${page.numberOfElements}"></strong> dari <strong th:text="${page.totalElements}"></strong> nasabah
        </span>
        <div style="display: flex; gap: 8px;">
          <a th:if="${page.hasPrevious()}" th:href="@{/cs/customers(q=${q}, period=${selectedPeriod}, startDate=${startDate}, endDate=${endDate}, page=${page.number - 1})}" 
             style="padding: 6px 14px; background: #f1f5f9; border-radius: 8px; text-decoration: none; font-weight: 700; color: #1e3a8a; font-size: 13px;">&larr; Prev</a>
          <span style="padding: 6px 14px; font-size: 13px; font-weight: 600; color: #334155;" th:text="${'Halaman ' + (page.number + 1) + ' dari ' + page.totalPages}"></span>
          <a th:if="${page.hasNext()}" th:href="@{/cs/customers(q=${q}, period=${selectedPeriod}, startDate=${startDate}, endDate=${endDate}, page=${page.number + 1})}" 
             style="padding: 6px 14px; background: #f1f5f9; border-radius: 8px; text-decoration: none; font-weight: 700; color: #1e3a8a; font-size: 13px;">Next &rarr;</a>
        </div>
      </div>

    </main>
  </div>
</div>
</body>
</html>
