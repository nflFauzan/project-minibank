# ===================================================================
# Nginx VirtualHost Configuration
# Target Domain: dev.minibank.tazkia.ac.id
# Target VPS: 139.190.97.52
# Path on Server: /etc/nginx/sites-available/dev.minibank.tazkia.ac.id
# ===================================================================

server {
    listen 80;
    listen [::]:80;
    server_name dev.minibank.tazkia.ac.id;

    # Let's Encrypt ACME challenge location for SSL issuance
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy all traffic to Spring Boot container
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Standard Proxy Headers (Crucial for Spring Security)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts and buffer sizes
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 25M;
    }
}

